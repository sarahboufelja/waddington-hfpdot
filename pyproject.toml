[project]
name = "waddington-hfpdot"
version = "0.1.0"
description = "A scalable, diagnostics-first MCMC sampler for high-dimensional randomized optimal-transport plans (HFPD-OT)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sarah Boufelja Yacobi" }]
license = { text = "MIT" }

# Runtime deps for the sampler stack (langevin_sampler, supports, mcmc_diagnostics,
# transport_summary). The full Waddington model (wadd_hfpdot_model.py) pulls heavier
# extras (torch, wot, anndata, ...) that are intentionally NOT declared here.
dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "POT>=0.9",          # entropic / unbalanced OT (Sinkhorn) for sampler initialization
]

[project.optional-dependencies]
# Reading real single-cell data (10x-style HDF5 count matrices). Optional because the sampler
# stack and the OT layer are usable -- and fully testable -- without any data files present.
data = [
    "h5py>=3.16.0",
]
# The modelling stack for the Waddington layers (GMVAE embedding, wadd_dim_reduction). Optional
# so a sampler-only install stays lean; the dev group below pulls it in for development.
model = [
    "torch>=2.10,<2.11",
]

# Development tooling AND the full stack this project is developed against, as a dependency GROUP
# (PEP 735): uv installs groups by DEFAULT on a bare `uv sync`, so everything here is always present
# and a plain sync can never silently drop it (unlike optional extras, which are opt-in and were
# repeatedly pruned). This is the single environment -- sampler (GPU jax), modelling (GPU torch),
# data reader, and test runner -- that replaces the earlier .venv/conda split.
[dependency-groups]
dev = [
    "pytest>=8",
    "arviz>=0.18",        # reference MCMC diagnostics, used for soundness cross-checks
    "matplotlib>=3.8",    # plotting (sampler_viz, diagnostic visualizations)
    "h5py>=3.16.0",       # also in the `data` extra; here so the reader's tests always have it
    "torch>=2.10,<2.11",  # also in the `model` extra; here so the GMVAE + its tests always run
    "jax[cuda12]>=0.4",   # GPU acceleration for the sampler on this dev machine (CUDA 12 family)
]

# torch's CUDA build is not on PyPI's default index. Pin it to the cu128 wheels (CUDA 12.8), which
# run on this box's driver 550 via forward-compat -- the PyPI default is now a CUDA-13 build that
# would need a newer driver. jax's GPU support comes from the [cuda12] extra (nvidia-* pip wheels).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Flat `src/` layout: the modules are imported by bare name (`import langevin_sampler`,
# `from supports import ...`). `package-dir = {"" = "src"}` puts them on the path on an
# (editable) install, so those bare imports keep working WITHOUT turning src/ into a
# namespaced package. This is deliberate -- namespacing would force every import to move.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "langevin_sampler",
    "supports",
    "mcmc_diagnostics",
    "transport_summary",
    "sampler_viz",
    "wadd_hfpdot_model",
]
